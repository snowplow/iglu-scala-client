name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - name: "Run tests"
            command: "coverage +test"
          - name: "Check Scala formatting"
            command: "scalafmtCheckAll"
          - name: "Check binary compatibility"
            command: "+mimaReportBinaryIssues"
          - name: "Check assets can be published"
            command: "+publishLocal"
    steps:
    - uses: actions/checkout@v5
    - uses: coursier/cache-action@v6

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Install sbt
      uses: sbt/setup-sbt@v1

    - name: ${{ matrix.task.name }}
      run: sbt ${{ matrix.task.command }}

  coverage:
    runs-on: ubuntu-latest
    needs: ci
    steps:
    - uses: actions/checkout@v5
    - uses: coursier/cache-action@v6

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Install sbt
      uses: sbt/setup-sbt@v1

    - name: Generate coverage report
      run: sbt coverage +test coverageAggregate

    - name: Submit coveralls data
      run: sbt coveralls
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}