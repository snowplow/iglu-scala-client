name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - name: "Run tests"
            command: "coverage +test"
          - name: "Check Scala formatting"
            command: "scalafmtCheckAll"
          - name: "Check binary compatibility"
            command: "+mimaReportBinaryIssues"
          - name: "Check assets can be published"
            command: "+publishLocal"
    steps:
    - uses: actions/checkout@v5
    - uses: coursier/cache-action@v6

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Install sbt
      uses: sbt/setup-sbt@v1

    - name: ${{ matrix.task.name }}
      run: sbt ${{ matrix.task.command }}

  coverage:
    runs-on: ubuntu-latest
    needs: ci
    steps:
    - uses: actions/checkout@v5
    - uses: coursier/cache-action@v6

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Install sbt
      uses: sbt/setup-sbt@v1

    - name: Generate coverage report
      run: sbt coverage +test coverageAggregate

    - name: Submit coveralls data
      run: sbt coveralls
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v5
    - uses: coursier/cache-action@v6

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Install sbt
      uses: sbt/setup-sbt@v1

    - name: Check Scala formatting
      run: sbt scalafmtCheckAll

    - name: Run tests with coverage
      run: sbt coverage test coverageAggregate

    - name: Coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: target/**/coverage-report/cobertura.xml
        badge: true
        format: markdown
        output: both

    - name: Add coverage to summary
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

    - name: Add coverage PR comment
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Cross-version tests
      run: sbt +test